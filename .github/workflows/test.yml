name: Django CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: "Lint (ruff, mypy)"
    env:
      UV_LOCKED: 1
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          cache-dependency-path: uv.lock
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra yaml

      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github

      - name: ruff format
        run: uv run --no-sync ruff format --check

      - name: mypy
        run: uv run --no-sync mypy scheduler/

  test-regular:
    runs-on: ubuntu-latest
    name: "Tests py${{ matrix.python-version }}/dj${{ matrix.django-version }}/${{ matrix.broker }}"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_LOCKED: 1
      PYTHONUNBUFFERED: 1
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15"]
        django-version: ["5.2.*", "6.0.*", "6.1.*"]
        broker: ["redis", "fakeredis", "valkey"]
        exclude:
          - python-version: "3.11"
            django-version: "6.0.*"
          - python-version: "3.11"
            django-version: "6.1.*"
        include:
          - python-version: "3.14t"
            django-version: "5.2.*"
            broker: "redis"
            coverage: yes
          - python-version: "3.14t"
            django-version: "6.1.*"
            broker: "redis"
            coverage: yes
    permissions:
      pull-requests: write
    services:
      redis:
        image: redis:8.10.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:9.1.2
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    outputs:
      version: ${{ steps.getVersion.outputs.VERSION }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          cache-dependency-path: uv.lock
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true

      - name: Install dependencies
        shell: bash
        run: |
          if [ ${{ matrix.broker == 'valkey' }} == true ]; then
            additional_args="--extra valkey"
          fi
          uv sync --extra yaml $additional_args

      - name: Get version
        id: getVersion
        shell: bash
        run: |
          VERSION=$(uv version --short)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Check for missing migrations
        env:
          UV_WORKING_DIR: testproject/
        run: |
          uv pip install -U "django==${{ matrix.django-version }}"
          uv run --no-sync manage.py makemigrations --check

      - name: Run Tests without coverage
        env:
          UV_WORKING_DIR: testproject/
        if: ${{ matrix.coverage != 'yes' }}
        run: |
          export FAKEREDIS=${{ matrix.broker == 'fakeredis' }}
          if [ ${{ matrix.broker == 'valkey' }} == true ]; then
            export BROKER_PORT=6380
          else
            export BROKER_PORT=6379
          fi
          uv pip install -U "django==${{ matrix.django-version }}"
          uv run --no-sync manage.py test --exclude-tag multiprocess scheduler

      # Steps for coverage check
      - name: Run tests with coverage
        uses: ./.github/actions/test-coverage
        if: ${{ matrix.coverage == 'yes' }}
        with:
          pythonVer: ${{ matrix.python-version }}
          djangoVer: ${{ matrix.django-version }}
          repoToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Create coverage badge
        if: ${{ matrix.coverage == 'yes' && github.event_name == 'push' }}
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: b756396efb895f0e34558c980f1ca0c7
          filename: django-tasks-scheduler-4.json
          label: coverage
          message: ${{ env.COVERAGE }}%
          color: green

  # Prepare a draft release for the GitHub Releases page for manual verification
  # If accepted and published, the release workflow would be triggered
  update_release_draft:
    permissions:
      contents: write # write permission is required to create a GitHub release
      pull-requests: write # write permission is required for auto-labeler otherwise, read permission is required at least
    needs: test-regular
    # Pull requests from a fork get a read-only GITHUB_TOKEN, so release-drafter cannot create the
    # draft release and the job fails on every outside contribution. The draft only needs refreshing
    # once a change is on master anyway.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          # Take the version from pyproject.toml rather than release-drafter's own label-based
          # resolver. `publish.yml` builds the distribution from pyproject, so a draft tagged from
          # anything else can publish a version to PyPI under a tag that does not match it -- and
          # the resolver drifts whenever a change lands without a labelled pull request.
          version: ${{ needs.test-regular.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
